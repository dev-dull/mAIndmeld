apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maindmeld
  annotations:
    # Long-poll and SSE need patient proxies. Adjust for your controller.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["maindmeld.example.com"]
      secretName: maindmeld-tls
  rules:
    - host: maindmeld.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maindmeld
                port:
                  name: http
