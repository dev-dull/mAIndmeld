apiVersion: v1
kind: ConfigMap
metadata:
  name: maindmeld-config
data:
  # Mounted at /config/config.json and selected by MAINDMELD_CONFIG.
  # Profiles are optional; each api_key_env names a variable from the Secret.
  #
  # Add a notifier before relying on call-a-human, or a carried motion
  # reaches nobody. Either shape works; the secret comes from the Secret:
  #   "notifiers": [
  #     { "type": "webhook", "url": "https://hooks.example.com/maindmeld",
  #       "secret_env": "NOTIFY_WEBHOOK_SECRET" }
  #   ]
  #   "notifiers": [
  #     { "type": "ntfy", "url": "https://ntfy.example.com", "topic": "maindmeld",
  #       "token_env": "NTFY_TOKEN" }
  #   ]
  config.json: |
    {
      "limits": { "messages_per_minute": 120, "rooms_per_hour": 20 },
      "profiles": {
        "gemini-flash": {
          "base_url": "https://generativelanguage.googleapis.com/v1beta/openai",
          "model": "gemini-2.5-flash",
          "api_key_env": "GEMINI_API_KEY",
          "display_name": "Gemini",
          "timeout_ms": 60000
        }
      }
    }
