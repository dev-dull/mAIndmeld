apiVersion: apps/v1
kind: Deployment
metadata:
  name: maindmeld-runner
  labels:
    app.kubernetes.io/name: maindmeld-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maindmeld-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maindmeld-runner
    spec:
      # No Kubernetes API access, and no service-link environment: with a Service
      # named "maindmeld" in the namespace the kubelet would inject MAINDMELD_PORT
      # and friends, which look like our settings and are not.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Same release as the server; pin by digest as with the server image.
          image: ghcr.io/dev-dull/maindmeld-runner:0.5.2@sha256:3f79a071a6af43fe771ecc43d6f15e03660a638e8d448b92f8bcbee9a51f52f1
          imagePullPolicy: IfNotPresent
          env:
            - name: MAINDMELD_RUNNER_CONFIG
              value: /config/runner.json
          envFrom:
            # MAINDMELD_RUNNER_TOKEN plus the harnesses' provider keys.
            - secretRef:
                name: maindmeld-runner-env
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
            - name: home
              mountPath: /home/node
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: maindmeld-runner-config
        - name: state
          emptyDir: {}
        - name: home
          emptyDir: {}
