# Try mAIndmeld with Docker Compose.
#
#   docker compose up -d            # the server alone
#   docker compose logs maindmeld    # copy the bootstrap token from the log
#   open http://localhost:7340/login
#
# Fully offline demo with a small local model as a participant:
#
#   docker compose --profile demo up -d
#   maindmeld invite MM-XXXX --model local     # or use the room_invite tool
#
# The demo profile pulls a small instruct model into a llama.cpp server on
# first start; expect a download of a few hundred megabytes.
#
# A runner beside the server, so a room can launch Claude Code or OpenCode
# with your own credentials:
#
#   maindmeld token create runner-compose    # put it in .env as MAINDMELD_RUNNER_TOKEN
#   docker compose --profile runner up -d
#
# The runner container is unprivileged and never sees the Docker socket.
# Harness logins live in the runner-home volume; provider keys come from
# .env (ANTHROPIC_API_KEY for Claude Code, whatever OpenCode's provider needs).

services:
  maindmeld:
    image: ghcr.io/dev-dull/maindmeld:0.5.0
    build: .
    ports:
      - "7340:7340"
    environment:
      MAINDMELD_DATA_DIR: /data
      MAINDMELD_BIND: 0.0.0.0
      MAINDMELD_CONFIG: /config/config.json
      # Set to the origin browsers will use if it is not localhost:7340.
      # MAINDMELD_PUBLIC_ORIGIN: https://meld.example
    env_file:
      - path: .env
        required: false
    volumes:
      - maindmeld-data:/data
      - ./deploy/compose/config.json:/config/config.json:ro
    restart: unless-stopped

  runner:
    profiles: ["runner"]
    image: ghcr.io/dev-dull/maindmeld-runner:0.5.0
    build:
      context: .
      dockerfile: Dockerfile.runner
    depends_on:
      maindmeld:
        condition: service_healthy
    environment:
      MAINDMELD_RUNNER_CONFIG: /config/runner.json
      # From .env or your shell; provider keys (ANTHROPIC_API_KEY, ...) come from .env too.
      MAINDMELD_RUNNER_TOKEN: ${MAINDMELD_RUNNER_TOKEN:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./deploy/compose/runner.json:/config/runner.json:ro
      - runner-state:/state
      - runner-home:/home/node
      # Opt-in, and only for the runner, never the server: give each harness
      # its own container by handing the runner the host's Docker socket.
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  llama:
    profiles: ["demo"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf Qwen/Qwen2.5-1.5B-Instruct-GGUF:q4_k_m
      --host 0.0.0.0 --port 8080 --ctx-size 8192 --parallel 2
    volumes:
      - llama-models:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
    restart: unless-stopped

volumes:
  maindmeld-data:
  llama-models:
  runner-state:
  runner-home:
